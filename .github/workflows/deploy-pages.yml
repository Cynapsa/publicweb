name: Deploy Pages

on:
  push:
    branches:
      - main
      - demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source branch
        id: source
        run: echo "branch=${BRANCH_TO_PAGES:-main}" >> "$GITHUB_OUTPUT"
        env:
          BRANCH_TO_PAGES: ${{ vars.BRANCH_TO_PAGES }}

      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.branch }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
